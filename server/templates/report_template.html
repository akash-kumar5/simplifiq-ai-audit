<!DOCTYPE html>
<html>

<head>
    <style>

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

        body {
    font-family: Arial, sans-serif;
    padding: 20px;
    color: #222;
    line-height: 1.4;
}

.header {
    border-bottom: 2px solid #111;
    padding-bottom: 12px;
    margin-bottom: 20px;
}

.title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 4px;
}

.subtitle {
    font-size: 13px;
    color: #666;
}

h1 {
    font-size: 16px;
    margin-top: 6px;
    margin-bottom: 4px;
}

h2 {
    font-size: 14px;
    margin-top: 5px;
    margin-bottom: 3px;
}

p {
    font-size: 12px;
    margin-bottom: 4px;
}

ul {
    margin-left: 18px;
    margin-top: 3px;
}

li {
    font-size: 12px;
    margin-bottom: 3px;
}

.section {
    margin-top: 8px;
}

.footer {
    margin-top: 30px;
    border-top: 1px solid #ccc;
    padding-top: 10px;
    font-size: 10px;
    color: #777;
}

.highlight {
    background-color: #f5f5f5;
    padding: 12px;
    border-left: 3px solid #111;
    margin-top: 10px;
    margin-bottom: 15px;
    font-size: 12px;
}

    </style>
</head>

<body>

    <div class="header">
        <div class="title">
            {{ company }} AI Audit Report
        </div>

        <div class="subtitle">
            Personalized AI workflow and automation insights
        </div>
    </div>

    <div class="highlight">
        This report provides AI-driven operational insights and automation opportunities tailored for {{ company }}.
    </div>

    <div class="section">
        {{ insights | safe }}
    </div>

    <div class="footer">
        Generated by SimplifiIQ AI Audit System
    </div>

</body>

</html>
